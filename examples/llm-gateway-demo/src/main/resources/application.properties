spring.application.name=spg-llm-gateway-demo
server.port=8080

# ── SPG configuration ──────────────────────────────────────────────────────────
# Leave defaults — heuristic + ML, all PII types, TOKEN redaction mode

# ── LLM backend ───────────────────────────────────────────────────────────────
# Leave blank to use the built-in stub LLM (no network calls, no API key needed)
llm.api-key=
llm.api-url=https://api.openai.com/v1/chat/completions
llm.model=gpt-4o-mini

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.semanticprivacyguard=INFO
